{% extends "base.html" %}
{% block title %}{{ err_title }} — MyLibrary{% endblock %}
{% block content %}
<div class="auth-card error-card">
  <div class="error-mark">▤</div>
  <div class="error-code">404</div>
  <h1>{{ err_title }}</h1>
  <p class="auth-sub">{{ message }}</p>
  <div class="error-actions">
    <a href="{{ url_for('home') }}" class="btn btn-primary">Back to the lobby</a>
    <a href="{{ url_for('my_library') }}" class="btn btn-ghost">My shelf</a>
  </div>
  <p class="error-trail">{{ trail }}</p>
</div>
{% endblock %}
