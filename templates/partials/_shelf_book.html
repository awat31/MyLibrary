{% if book.cover_src %}
  <a href="{{ url_for('book_detail', book_id=book.id) }}" class="book" title="{{ book.title }} — {{ book.author }}">
    <img src="{{ book.cover_src }}" alt="Cover of {{ book.title }}" loading="lazy" data-fallback-remove="1">
    <span class="book-vertebra"></span>
  </a>
{% else %}
  <a href="{{ url_for('book_detail', book_id=book.id) }}" class="book spine spine-{{ spine_variant(book.title) }}" title="{{ book.title }} — {{ book.author }}">
    <span class="spine-title">{{ book.title }}</span>
    <span class="spine-author">{{ book.author }}</span>
    <span class="book-vertebra"></span>
  </a>
{% endif %}
