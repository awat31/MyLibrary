# MyLibrary — optional nginx reverse proxy front (Option B)
# Copy to /etc/nginx/sites-available/mylibrary, symlink into sites-enabled,
# then `certbot --nginx -d library.example.com` will rewrite TLS paths.

upstream mylibrary_app {
    server 127.0.0.1:8000;
    keepalive 32;
}

server {
    listen 80;
    server_name library.example.com;

    # Let certbot handle ACME challenges; everything else moves to TLS.
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name library.example.com;

    # certbot replaces these two lines with its managed certs:
    ssl_certificate     /etc/ssl/certs/ssl-cert-snakeoil.pem;
    ssl_certificate_key /etc/ssl/private/ssl-cert-snakeoil.key;

    # Modern TLS
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    # Book covers hotlink to external origins (Open Library) — let img-src do it.
    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    # HSTS is set by the app itself too; harmless duplication:
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;

    # These match the app's SECURE_HEADERS; nginx stops blocking them.
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;

    # 10 MB: matches the app's upload limit with headroom for multipart framing.
    client_max_body_size 10m;

    location / {
        proxy_pass http://mylibrary_app;
        proxy_read_timeout 120s;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }
}
